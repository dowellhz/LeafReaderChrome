<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>LeafReader</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="brand">
          <i>◒</i>
          <div><strong>LeafReader</strong><small>Reading companion</small></div>
        </div>
        <button id="openReader" title="Open reading mode">↗</button>
      </header>
      <section id="panel">
        <div class="empty">
          <b>☘</b>
          <h1>Ready to read</h1>
          <p>
            Select text on the webpage to translate, look up, annotate, or ask
            AI.
          </p>
        </div>
      </section>
      <footer>Local-first reading notes</footer>
    </main>
    <script src="panel-store.js"></script>
    <script src="panel-markdown.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
